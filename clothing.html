
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11110f">
  <title>Velvet Aura Studio | Clothing — Coming Soon</title>
  <meta name="description" content="Our own clothing collection is on its way. Designed with a vision. Made to stand out.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #11110f;
      color: #f6f0e5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 28px 7%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      color: #e9d8b4;
      font-family: Georgia, serif;
      font-size: clamp(18px, 3vw, 28px);
      letter-spacing: 3px;
    }

    .label {
      color: #b9b3a7;
      font-size: 11px;
      letter-spacing: 3px;
    }

    main {
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 65px 0;
      text-align: center;
    }

    .eyebrow {
      color: #c6a978;
      font-size: 11px;
      letter-spacing: 4px;
      margin-bottom: 24px;
    }

    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(38px, 7vw, 76px);
      line-height: 1.12;
      margin-bottom: 24px;
    }

    .description {
      color: #d1ccc2;
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.9;
      max-width: 540px;
      margin: 0 auto 32px;
    }

    .coming-soon {
      display: inline-block;
      border: 1px solid #b99a67;
      border-radius: 40px;
      padding: 14px 30px;
      color: #e9d8b4;
      font-size: 11px;
      letter-spacing: 3px;
    }

    footer {
      padding-top: 25px;
      text-align: center;
      color: #928b80;
      font-size: 10px;
      letter-spacing: 3px;
    }

    @media (max-width: 480px) {
      .page {
        padding: 24px 6%;
      }

      h1 {
        font-size: 42px;
      }

      .description {
        line-height: 1.8;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">VELVET AURA</div>
      <div class="label">CLOTHING</div>
    </header>

    <main>
      <p class="eyebrow">A NEW CHAPTER BEGINS</p>
      <h1>Something Stylish Is Coming.</h1>
      <p class="description">
        Our own clothing collection is on its way.
        Designed with a vision. Made to stand out.
      </p>
      <div class="coming-soon">COMING SOON</div>
    </main>

    <footer>VELVET AURA STUDIO · EST. 2026</footer>
  </div>
</body>
</html>
