<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - Velvet Aura Studio</title>

    <link rel="stylesheet" href="style.css">

    <style>

/* =========================
   ADMIN CONTAINER
========================= */

.admin-container {
    max-width: 1250px;
    margin: 90px auto 40px;
    padding: 0 16px;
}

.admin-title {
    text-align: center;
    color: #22d3ee;
    margin: 0 0 22px;
    font-size: 28px;
}


/* =========================
   FORM
========================= */

.deal-form,
.deals-section {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 22px;
}

.deal-form h2,
.deals-section h2 {
    margin: 0 0 18px;
    color: #22d3ee;
    font-size: 20px;
}


/* =========================
   FORM GRID
========================= */

.form-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    color: #cbd5e1;
    font-size: 12px;
    font-weight: 500;
}


/* =========================
   INPUTS
========================= */

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #334155;
    border-radius: 7px;
    background: #0f172a;
    color: white;
    outline: none;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 13px;
}

.form-group textarea {
    min-height: 70px;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #22d3ee;
    box-shadow: 0 0 0 1px rgba(34,211,238,0.12);
}


/* =========================
   CATEGORY
========================= */

.category-wrapper {
    position: relative;
}

.category-input {
    width: 100%;
}

.category-options {
    display: none;
    position: absolute;
    z-index: 100;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 190px;
    overflow-y: auto;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 7px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
}

.category-options.show {
    display: block;
}

.category-option {
    padding: 8px 10px;
    color: #cbd5e1;
    cursor: pointer;
    font-size: 13px;
}

.category-option:hover {
    background: #1e293b;
    color: #22d3ee;
}


/* =========================
   HELP TEXT
========================= */

.image-help,
.tags-help {
    color: #64748b;
    font-size: 10px;
}


/* =========================
   FORM BUTTONS
========================= */

.add-deal-btn {
    margin-top: 16px;
    padding: 9px 20px;
    border: none;
    border-radius: 7px;
    background: #22d3ee;
    color: #000;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.add-deal-btn:hover {
    background: #67e8f9;
    transform: translateY(-1px);
}

.cancel-edit-btn {
    margin-top: 16px;
    margin-left: 7px;
    padding: 8px 18px;
    border: 1px solid #64748b;
    border-radius: 7px;
    background: transparent;
    color: #cbd5e1;
    font-weight: 600;
    cursor: pointer;
}

.cancel-edit-btn:hover {
    background: #334155;
}

.message {
    margin-top: 10px;
    color: #22d3ee;
    font-size: 13px;
}


/* =========================
   DEAL HEADER
========================= */

.deals-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
}

.deals-header h2 {
    margin: 0;
}

.header-buttons {
    display: flex;
    gap: 8px;
}

.refresh-btn {
    padding: 8px 14px;
    border: 1px solid #22d3ee;
    border-radius: 7px;
    background: transparent;
    color: #22d3ee;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
}

.refresh-btn:hover {
    background: #22d3ee;
    color: #000;
}


/* =========================
   ADMIN SEARCH
========================= */

.admin-search {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 15px;
    box-sizing: border-box;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: white;
    outline: none;
    font-size: 13px;
}

.admin-search:focus {
    border-color: #22d3ee;
}


/* =========================
   DEAL LIST
========================= */

.deals-list {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
}


/* =========================
   DEAL CARD
========================= */

.admin-deal-card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    overflow: hidden;
    transition: 0.2s;
}

.admin-deal-card:hover {
    border-color: #22d3ee;
    transform: translateY(-2px);
}


/* =========================
   DEAL IMAGE
========================= */

.admin-deal-image {
    width: 100%;
    height: 135px;
    object-fit: contain;
    display: block;
    background: #fff;
    padding: 5px;
    box-sizing: border-box;
}


/* =========================
   DEAL INFO
========================= */

.admin-deal-info {
    padding: 11px;
}

.admin-deal-info h3 {
    color: white;
    margin: 0 0 5px;
    font-size: 15px;
    line-height: 1.25;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.admin-deal-info p {
    color: #94a3b8;
    margin: 4px 0;
    font-size: 11px;
    line-height: 1.3;
}

.price {
    color: #22d3ee !important;
    font-size: 15px !important;
    font-weight: bold;
}

.price del {
    color: #64748b;
    font-size: 11px;
}


/* =========================
   TAGS
========================= */

.tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
}

.tag {
    background: rgba(34,211,238,0.10);
    border: 1px solid rgba(34,211,238,0.25);
    color: #22d3ee;
    padding: 3px 6px;
    border-radius: 15px;
    font-size: 9px;
}


/* =========================
   IMAGE COUNT
========================= */

.image-count {
    color: #64748b !important;
    font-size: 10px !important;
}


/* =========================
   CARD BUTTONS
========================= */

.card-buttons {
    display: flex;
    gap: 6px;
    margin-top: 9px;
}

.edit-btn,
.delete-btn {
    flex: 1;
    padding: 7px;
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
}

.edit-btn {
    background: #2563eb;
}

.edit-btn:hover {
    background: #1d4ed8;
}

.delete-btn {
    background: #ef4444;
}

.delete-btn:hover {
    background: #dc2626;
}


/* =========================
   LOADING
========================= */

.loading,
.empty-message {
    color: #cbd5e1;
    text-align: center;
    padding: 20px;
}


/* =========================
   TABLET
========================= */

@media (max-width: 1000px) {

    .form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .deals-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .admin-container {
        margin-top: 80px;
        padding: 0 10px;
    }

    .admin-title {
        font-size: 22px;
        margin-bottom: 16px;
    }

    .deal-form,
    .deals-section {
        padding: 14px;
        border-radius: 10px;
    }

    .form-grid {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .form-group.full {
        grid-column: auto;
    }

    .deals-list {
        grid-template-columns: 1fr;
    }

    .deals-header {
        flex-direction: row;
    }

    .refresh-btn {
        padding: 7px 10px;
    }

    .admin-deal-image {
        height: 170px;
    }

    .card-buttons {
        gap: 8px;
    }

}

</style>

</head>


<body>


<div class="admin-container">


    <!-- =========================
         TITLE
    ========================= -->

    <h1 class="admin-title">
        🔐 Velvet Aura Admin Panel
    </h1>


    <!-- =========================
         ADD / EDIT DEAL FORM
    ========================= -->

    <div class="deal-form">

        <h2 id="formTitle">
            ➕ Add New Deal
        </h2>


        <form id="dealForm">


            <div class="form-grid">


                <!-- PRODUCT NAME -->

                <div class="form-group">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Samsung Galaxy Phone"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <div class="category-wrapper">

                        <input
                            type="text"
                            id="category"
                            class="category-input"
                            placeholder="Type 2-3 letters or select..."
                            autocomplete="off"
                            required
                        >

                        <div
                            id="categoryOptions"
                            class="category-options"
                        ></div>

                    </div>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group full">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Enter product description"
                        required
                    ></textarea>

                </div>


                <!-- IMAGE 1 -->

                <div class="form-group">

                    <label>
                        Image URL 1 *
                    </label>

                    <input
                        type="url"
                        id="image1"
                        placeholder="https://example.com/image1.jpg"
                        required
                    >

                    <span class="image-help">
                        First image is required.
                    </span>

                </div>


                <!-- IMAGE 2 -->

                <div class="form-group">

                    <label>
                        Image URL 2
                    </label>

                    <input
                        type="url"
                        id="image2"
                        placeholder="Optional"
                    >

                </div>


                <!-- IMAGE 3 -->

                <div class="form-group">

                    <label>
                        Image URL 3
                    </label>

                    <input
                        type="url"
                        id="image3"
                        placeholder="Optional"
                    >

                </div>


                <!-- IMAGE 4 -->

                <div class="form-group">

                    <label>
                        Image URL 4
                    </label>

                    <input
                        type="url"
                        id="image4"
                        placeholder="Optional"
                    >

                </div>


                <!-- IMAGE 5 -->

                <div class="form-group">

                    <label>
                        Image URL 5
                    </label>

                    <input
                        type="url"
                        id="image5"
                        placeholder="Optional"
                    >

                </div>
                 

                <!-- IMAGE 6 -->

                <div class="form-group">

                    <label>
                        Image URL 6
                    </label>

                    <input
                        type="url"
                        id="image6"
                        placeholder="Optional"
                    >

                </div>


                <!-- IMAGE 7 -->

                <div class="form-group">

                    <label>
                        Image URL 7
                    </label>

                    <input
                        type="url"
                        id="image7"
                        placeholder="Optional"
                    >

                </div>


                <!-- ORIGINAL PRICE -->

                <div class="form-group">

                    <label>
                        Original Price
                    </label>

                    <input
                        type="number"
                        id="originalPrice"
                        placeholder="2999"
                        min="0"
                        required
                    >

                </div>


                <!-- DEAL PRICE -->

                <div class="form-group">

                    <label>
                        Deal Price
                    </label>

                    <input
                        type="number"
                        id="dealPrice"
                        placeholder="1999"
                        min="0"
                        required
                    >

                </div>


                <!-- DISCOUNT -->

                <div class="form-group">

                    <label>
                        Discount %
                    </label>

                    <input
                        type="number"
                        id="discount"
                        placeholder="33"
                        min="-100"
                        max="100"
                        required
                    >

                </div>


                <!-- STORE -->

                <div class="form-group">

                    <label>
                        Store
                    </label>

                    <input
                        type="text"
                        id="store"
                        placeholder="Amazon"
                        required
                    >

                </div>


                <!-- TAGS -->

                <div class="form-group full">

                    <label>
                        Tags
                    </label>

                    <input
                        type="text"
                        id="tags"
                        placeholder="phone, smartphone, samsung, android"
                    >

                    <span class="tags-help">
                        Multiple tags ko comma (,) se separate karo.
                    </span>

                </div>


                <!-- AFFILIATE URL -->

                <div class="form-group full">

                    <label>
                        Affiliate URL
                    </label>

                    <input
                        type="url"
                        id="affiliateUrl"
                        placeholder="https://amzn.to/..."
                        required
                    >

                </div>


            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="add-deal-btn"
                id="submitBtn"
            >
                Add Deal
            </button>


            <!-- CANCEL EDIT -->

            <button
                type="button"
                class="cancel-edit-btn"
                id="cancelEditBtn"
                onclick="cancelEdit()"
            >
                Cancel Edit
            </button>


            <p
                class="message"
                id="message"
            ></p>


        </form>

    </div>


    <!-- =========================
         EXISTING DEALS
    ========================= -->

    <div class="deals-section">


        <div class="deals-header">

            <h2>
                📦 Existing Deals
            </h2>


            <div class="header-buttons">

                <button
                    class="refresh-btn"
                    onclick="loadDeals()"
                >
                    🔄 Refresh
                </button>

            </div>

        </div>


        <!-- SEARCH -->

        <input
            type="text"
            id="adminSearch"
            class="admin-search"
            placeholder="🔎 Search by product, category, tags or store..."
        >


        <!-- DEALS -->

        <div
            id="dealsList"
            class="deals-list"
        >

            <p class="loading">
                Loading deals...
            </p>

        </div>


    </div>


</div>


<script>


// =========================
// API
// =========================

const API_URL =
    "https://velvet-aura-studio.onrender.com";


// =========================
// ELEMENTS
// =========================

const form =
    document.getElementById("dealForm");

const message =
    document.getElementById("message");

const dealsList =
    document.getElementById("dealsList");

const adminSearch =
    document.getElementById("adminSearch");

const categoryInput =
    document.getElementById("category");

const categoryOptions =
    document.getElementById("categoryOptions");


// =========================
// EDIT STATE
// =========================

let editingDealId = null;

let allDeals = [];


// =========================
// CATEGORIES
// =========================

const categories = [

    "Electronics",

    "Mobile & Accessories",

    "Computers & Laptops",

    "Camera & Photography",

    "Audio",

    "Home & Kitchen",

    "Fashion & Clothing",

    "Beauty & Personal Care",

    "Sports & Fitness",

    "Toys & Games",

    "Books",

    "Office Products",

    "Automotive",

    "Grocery",

    "Health & Household",

    "Other"

];


// =========================
// CATEGORY SUGGESTIONS
// =========================

function showCategoryOptions() {

    const query =
        categoryInput.value
            .trim()
            .toLowerCase();


    categoryOptions.innerHTML = "";


    const filtered =
        categories.filter(category => {

            return category
                .toLowerCase()
                .includes(query);

        });


    filtered.forEach(category => {


        const option =
            document.createElement("div");


        option.className =
            "category-option";


        option.textContent =
            category;


        option.addEventListener(
            "click",
            () => {

                categoryInput.value =
                    category;

                categoryOptions.classList.remove(
                    "show"
                );

            }
        );


        categoryOptions.appendChild(
            option
        );

    });


    if (filtered.length > 0) {

        categoryOptions.classList.add(
            "show"
        );

    } else {

        categoryOptions.classList.remove(
            "show"
        );

    }

}


categoryInput.addEventListener(
    "focus",
    showCategoryOptions
);


categoryInput.addEventListener(
    "input",
    showCategoryOptions
);


document.addEventListener(
    "click",
    (event) => {

        if (
            !event.target.closest(
                ".category-wrapper"
            )
        ) {

            categoryOptions.classList.remove(
                "show"
            );

        }

    }
);


// =========================
// ADD / UPDATE DEAL
// =========================

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        // =========================
        // IMAGES
        // =========================

        const images = [

            document
                .getElementById("image1")
                .value
                .trim(),

            document
                .getElementById("image2")
                .value
                .trim(),

            document
                .getElementById("image3")
                .value
                .trim(),

            document
                .getElementById("image4")
                .value
                .trim(),

            document
                .getElementById("image5")
                .value
                .trim(),
            document
                .getElementById("image6")
                .value
                .trim(),
            document
                .getElementById("image7")
                .value
                .trim()

        ].filter(Boolean);


        // =========================
        // TAGS
        // =========================

        const tags =
            document
                .getElementById("tags")
                .value
                .split(",")
                .map(tag =>
                    tag
                        .trim()
                        .toLowerCase()
                )
                .filter(Boolean);


        // =========================
        // DEAL OBJECT
        // =========================

        const deal = {

            productName:
                document
                    .getElementById("productName")
                    .value
                    .trim(),

            description:
                document
                    .getElementById("description")
                    .value
                    .trim(),

            images:
                images,

            originalPrice:
                Number(
                    document
                        .getElementById("originalPrice")
                        .value
                ),

            dealPrice:
                Number(
                    document
                        .getElementById("dealPrice")
                        .value
                ),

            discount:
                Number(
                    document
                        .getElementById("discount")
                        .value
                ),

            store:
                document
                    .getElementById("store")
                    .value
                    .trim(),

            affiliateUrl:
                document
                    .getElementById("affiliateUrl")
                    .value
                    .trim(),

            category:
                document
                    .getElementById("category")
                    .value
                    .trim(),

            tags:
                tags

        };


        try {


            message.textContent =
                editingDealId
                    ? "Updating deal..."
                    : "Saving deal...";


            // =========================
            // URL + METHOD
            // =========================

            const url =
                editingDealId

                    ? `${API_URL}/api/deals/${editingDealId}`

                    : `${API_URL}/api/deals`;


            const method =
                editingDealId
                    ? "PUT"
                    : "POST";


            // =========================
            // API REQUEST
            // =========================

            const response =
                await fetch(
                    url,
                    {

                        method: method,

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(deal)

                    }
                );


            const data =
                await response.json();


            // =========================
            // SUCCESS
            // =========================

            if (data.success) {


                message.textContent =
                    editingDealId

                        ? "✅ Deal updated successfully!"

                        : "✅ Deal added successfully!";


                form.reset();


                editingDealId =
                    null;


                document.getElementById(
                    "formTitle"
                ).textContent =
                    "➕ Add New Deal";


                document.getElementById(
                    "submitBtn"
                ).textContent =
                    "Add Deal";


                document.getElementById(
                    "cancelEditBtn"
                ).style.display =
                    "none";


                await loadDeals();


            } else {


                message.textContent =
                    "❌ " +
                    (
                        data.message ||
                        "Something went wrong"
                    );

            }


        } catch (error) {


            console.error(
                "DEAL SAVE ERROR:",
                error
            );


            message.textContent =
                "❌ Server connection failed.";

        }

    }
);


// =========================
// LOAD DEALS
// =========================

async function loadDeals() {


    dealsList.innerHTML =
        `
        <p class="loading">
            Loading deals...
        </p>
        `;


    try {


        const response =
            await fetch(
                `${API_URL}/api/deals`
            );


        const data =
            await response.json();


        if (
            !data.success ||
            !data.deals
        ) {


            dealsList.innerHTML =
                `
                <p class="empty-message">
                    ❌ Failed to load deals.
                </p>
                `;


            return;

        }


        allDeals =
            data.deals;


        renderDeals(
            allDeals
        );


    } catch (error) {


        console.error(
            "LOAD DEALS ERROR:",
            error
        );


        dealsList.innerHTML =
            `
            <p class="empty-message">
                ❌ Failed to load deals.
            </p>
            `;

    }

}


// =========================
// RENDER DEALS
// =========================

function renderDeals(deals) {


    if (
        !deals ||
        deals.length === 0
    ) {


        dealsList.innerHTML =
            `
            <p class="empty-message">
                No matching products found.
            </p>
            `;


        return;

    }


    dealsList.innerHTML = "";


    deals.forEach(
        deal => {


            // =========================
            // IMAGES
            // =========================

            const images =
                Array.isArray(deal.images) &&
                deal.images.length > 0

                    ? deal.images

                    : deal.image
                        ? [deal.image]
                        : [];


            const firstImage =
                images[0] || "";


            // =========================
            // TAGS
            // =========================

            const tags =
                Array.isArray(deal.tags)
                    ? deal.tags
                    : [];


            // =========================
            // CARD
            // =========================

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "admin-deal-card";


            card.innerHTML = `

                ${
                    firstImage

                        ? `

                        <img
                            class="admin-deal-image"
                            src="${firstImage}"
                            alt="${deal.productName || "Product"}"
                            onerror="this.style.display='none'"
                        >

                        `

                        : ""
                }


                <div class="admin-deal-info">


                    <h3>
                        ${deal.productName || "Untitled Product"}
                    </h3>


                    <p>
                        ${deal.description || ""}
                    </p>


                    <p class="price">

                        ₹${Number(
                            deal.dealPrice || 0
                        ).toLocaleString("en-IN")}

                        &nbsp;

                        <del>
                            ₹${Number(
                                deal.originalPrice || 0
                            ).toLocaleString("en-IN")}
                        </del>

                    </p>


                    <p>
                        🏪 ${deal.store || "N/A"}
                    </p>


                    <p>
                        📂 ${deal.category || "Other"}
                    </p>


                    <p>
                        🔥 ${deal.discount || 0}% OFF
                    </p>


                    ${
                        tags.length > 0

                            ? `

                            <div class="tag-list">

                                ${tags.map(tag => `

                                    <span class="tag">
                                        #${tag}
                                    </span>

                                `).join("")}

                            </div>

                            `

                            : ""
                    }


                    <p class="image-count">

                        🖼️ ${images.length}
                        image${images.length === 1 ? "" : "s"}

                    </p>


                    <div class="card-buttons">


                        <button
                            class="edit-btn"
                            onclick="editDeal('${deal._id}')"
                        >
                            ✏️ Edit
                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteDeal('${deal._id}')"
                        >
                            🗑️ Delete
                        </button>


                    </div>


                </div>

            `;


            dealsList.appendChild(
                card
            );

        }
    );

}


// =========================
// ADMIN SEARCH
// =========================

adminSearch.addEventListener(
    "input",
    () => {


        const query =
            adminSearch.value
                .trim()
                .toLowerCase();


        // Empty search

        if (!query) {

            renderDeals(
                allDeals
            );

            return;

        }


        const results =
            allDeals.filter(
                deal => {


                    const productName =
                        (
                            deal.productName || ""
                        )
                        .toLowerCase();


                    const category =
                        (
                            deal.category || ""
                        )
                        .toLowerCase();


                    const store =
                        (
                            deal.store || ""
                        )
                        .toLowerCase();


                    const description =
                        (
                            deal.description || ""
                        )
                        .toLowerCase();


                    const tags =
                        Array.isArray(
                            deal.tags
                        )

                            ? deal.tags
                                .join(" ")
                                .toLowerCase()

                            : "";


                    return (

                        productName.includes(
                            query
                        )

                        ||

                        category.includes(
                            query
                        )

                        ||

                        store.includes(
                            query
                        )

                        ||

                        description.includes(
                            query
                        )

                        ||

                        tags.includes(
                            query
                        )

                    );

                }
            );


        renderDeals(
            results
        );

    }
);


// =========================
// EDIT DEAL
// =========================

function editDeal(id) {


    const deal =
        allDeals.find(
            item =>
                item._id === id
        );


    if (!deal) {

        alert(
            "Deal not found."
        );

        return;

    }


    editingDealId =
        id;


    // =========================
    // FORM TITLE
    // =========================

    document.getElementById(
        "formTitle"
    ).textContent =
        "✏️ Edit Deal";


    document.getElementById(
        "submitBtn"
    ).textContent =
        "Update Deal";


    document.getElementById(
        "cancelEditBtn"
    ).style.display =
        "inline-block";


    // =========================
    // BASIC FIELDS
    // =========================

    document.getElementById(
        "productName"
    ).value =
        deal.productName || "";


    document.getElementById(
        "description"
    ).value =
        deal.description || "";


    document.getElementById(
        "originalPrice"
    ).value =
        deal.originalPrice || "";


    document.getElementById(
        "dealPrice"
    ).value =
        deal.dealPrice || "";


    document.getElementById(
        "discount"
    ).value =
        deal.discount || "";


    document.getElementById(
        "store"
    ).value =
        deal.store || "";


    document.getElementById(
        "category"
    ).value =
        deal.category || "Other";


    document.getElementById(
        "affiliateUrl"
    ).value =
        deal.affiliateUrl || "";


    // =========================
    // IMAGES
    // =========================

    const images =
        Array.isArray(deal.images) &&
        deal.images.length > 0

            ? deal.images

            : deal.image
                ? [deal.image]
                : [];


    for (
        let i = 1;
        i <= 7;
        i++
    ) {

        document.getElementById(
            `image${i}`
        ).value =
            images[i - 1] || "";

    }


    // =========================
    // TAGS
    // =========================

    document.getElementById(
        "tags"
    ).value =

        Array.isArray(deal.tags)

            ? deal.tags.join(", ")

            : "";


    // =========================
    // SCROLL TO FORM
    // =========================

    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


// =========================
// CANCEL EDIT
// =========================

function cancelEdit() {


    editingDealId =
        null;


    form.reset();


    document.getElementById(
        "formTitle"
    ).textContent =
        "➕ Add New Deal";


    document.getElementById(
        "submitBtn"
    ).textContent =
        "Add Deal";


    document.getElementById(
        "cancelEditBtn"
    ).style.display =
        "none";


    message.textContent =
        "";

}


// =========================
// DELETE DEAL
// =========================

async function deleteDeal(id) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this deal?"
        );


    if (!confirmDelete) {

        return;

    }


    try {


        const response =
            await fetch(
                `${API_URL}/api/deals/${id}`,
                {

                    method: "DELETE"

                }
            );


        const data =
            await response.json();


        if (data.success) {


            alert(
                "✅ Deal deleted successfully!"
            );


            await loadDeals();


        } else {


            alert(
                "❌ " +
                (
                    data.message ||
                    "Failed to delete deal"
                )
            );

        }


    } catch (error) {


        console.error(
            "DELETE ERROR:",
            error
        );


        alert(
            "❌ Server connection failed."
        );

    }

}
