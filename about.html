<!DOCTYPE html>
<html lang="en">
<head>
 <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>About Us | Velvet Aura Studio</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            line-height:1.8;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:auto;
        }

        nav{
            padding:25px 0;
            background:#111827;
            border-bottom:1px solid rgba(255,255,255,0.08);
        }

        .logo{
            font-size:28px;
            font-weight:700;
            color:#22d3ee;
        }

        main{
            padding:80px 0;
        }

        h1{
            color:#22d3ee;
            font-size:42px;
            margin-bottom:15px;
        }

        .intro{
            color:#cbd5e1;
            margin-bottom:40px;
        }

        .team-member{
            background:#1e293b;
            padding:30px;
            border-radius:8px;
            margin-bottom:30px;
            display:flex;
            align-items:center;
        }

        .team-member img{
            width:100px;
            height:100px;
            border-radius:50%;
            margin-right:20px;
        }

        .team-member h3{
            color:#22d3ee;
            margin-bottom:5px;
        }

        .team-member p{
            color:#cbd5e1;
        }

        .contact-box{
            background:#1e293b;
            padding:35px;
            border-radius:15px;
            border:1px solid rgba(255,255,255,0.05);
        }

        h2{
            color:#22d3ee;
            margin-bottom:15px;
        }

        p{
            color:#cbd5e1;
            margin-bottom:15px;
        }

        .email{
            display:inline-block;
            margin-top:10px;
            padding:12px 20px;
            background:#22d3ee;
            color:#000;
            border-radius:8px;
            text-decoration:none;
            font-weight:600;
        }

        .email:hover{
            opacity:.85;
        }

        footer{
            text-align:center;
            padding:30px;
            border-top:1px solid rgba(255,255,255,0.08);
            color:#94a3b8;
        }
